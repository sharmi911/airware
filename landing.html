<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirAware - Welcome</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #020824, #031434, #04214b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .title {
            font-size: 70px;
            font-weight: 600;
            color: #4de4ff;
            text-shadow: 0 0 25px #00eaff, 0 0 60px #00eaff;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 20px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .btn {
            background: #0a74dd;
            padding: 12px 30px;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #0f8bff;
            transform: scale(1.05);
        }

        .enter-text {
            margin-top: 15px;
            opacity: 0.7;
            font-size: 15px;
        }
    </style>

</head>
<body>

    <div>
        <div class="title">AirAware</div>
        <div class="tagline">Precision in Every Prediction</div>

        <button class="btn" onclick="enterDashboard()">Enter Dashboard</button>

        <div class="enter-text">Or press ENTER</div>
    </div>

    <script>
    function enterDashboard() {
        window.location.href = "/dashboard"; // Flask route
    }

    window.onload = function() {
        document.body.focus();
    };

    document.addEventListener("keydown", function(event) {
        console.log("Key pressed:", event.key); // To debug
        if (event.key === "Enter") {
            enterDashboard();
        }
    });
</script>


</body>
</html>
